[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specimux-cloud"
version = "0.1.1"
description = "Hosted specimux-suite: the uploader, run API, console and compute jobs for sequencing runs in the cloud"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
authors = [{ name = "Josh Walker", email = "joshowalker@yahoo.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["bioinformatics", "nanopore", "sequencing", "barcoding", "cloud"]
dependencies = [
    # The engine, the viewer app factory, the commands facade and the pages
    "specimux-suite>=0.3.7",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sse-starlette>=1.8",
    "httpx>=0.27",
    "cryptography>=41",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/joshuaowalker/specimux-cloud"
Repository = "https://github.com/joshuaowalker/specimux-cloud"
Issues = "https://github.com/joshuaowalker/specimux-cloud/issues"

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "boto3>=1.34", "moto[s3,sqs,dynamodb]>=5"]

[project.scripts]
specimux-cloud = "specimux_cloud.cli:main"

[project.entry-points."specimux_suite.plugins"]
cloud = "specimux_cloud.engine.plugin:cloud_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
